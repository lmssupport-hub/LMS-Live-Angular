<div class="min-h-screen w-full overflow-hidden rounded-[28px] bg-white font-sans text-[#555555]">

 

  <!-- MAIN CONTENT -->
<main class="grid min-h-[80vh] translate-y-16 grid-cols-1 items-center gap-8 px-[2.1%] pb-10 lg:grid-cols-[55%_45%] lg:gap-0 lg:pb-16">

    <!-- LEFT IMAGE -->
    <section class="flex min-h-[500px] h-full items-center justify-center">
      <img
  src="/imgcomponent/contact-us/rafiki.png"
  alt="Customer support illustration"
  class="h-auto w-full max-w-[850px] object-contain"
/>
    </section>

    <!-- RIGHT CONTENT -->
    <section class="flex w-full flex-col justify-center px-4 lg:pl-6 lg:pr-[3.5%]">

      <h1 class="mb-4 text-[48px] font-bold leading-tight tracking-tight text-[#7185e8] md:text-[64px]">
        Let's Talk...
      </h1>

      <p class="mb-10 max-w-[650px] text-[16px] leading-[26px] text-[#5b5b5b] md:text-[17px]">
        "Let's Connect
        <br />
        Have A Project, Question, Or Idea In Mind? Get In Touch With Us, And Let's
        Explore How We Can Work Together."
      </p>

      <!-- CONTACT FORM -->
      <form
        #contactForm="ngForm"
        (ngSubmit)="onSubmit(contactForm)"
        class="flex w-full flex-col gap-[34px]"
      >

        <!-- NAME -->
        <div>
          <input
            type="text"
            name="name"
            [(ngModel)]="contact.name"
            #name="ngModel"
            required
            placeholder="Your Name"
            class="h-[62px] w-full rounded-[18px] border border-transparent bg-[#f5f5f5] px-6 text-[16px] text-[#444444] outline-none placeholder:text-[#a2a2a2] focus:border-[#7185e8] focus:bg-white"
          />

          <span *ngIf="name.invalid && name.touched" class="mt-1 block text-sm text-red-500">
            Please enter your name.
          </span>
        </div>

        <!-- LOCATION -->
        <div>
          <input
            type="text"
            name="location"
            [(ngModel)]="contact.location"
            #location="ngModel"
            required
            placeholder="Location"
            class="h-[62px] w-full rounded-[18px] border border-transparent bg-[#f5f5f5] px-6 text-[16px] text-[#444444] outline-none placeholder:text-[#a2a2a2] focus:border-[#7185e8] focus:bg-white"
          />

          <span *ngIf="location.invalid && location.touched" class="mt-1 block text-sm text-red-500">
            Please enter your location.
          </span>
        </div>

        <!-- PHONE -->
        <div>
          <input
            type="tel"
            name="phone"
            [(ngModel)]="contact.phone"
            #phone="ngModel"
            required
            pattern="[0-9+() -]{7,20}"
            placeholder="Phone No"
            class="h-[62px] w-full rounded-[18px] border border-transparent bg-[#f5f5f5] px-6 text-[16px] text-[#444444] outline-none placeholder:text-[#a2a2a2] focus:border-[#7185e8] focus:bg-white"
          />

          <span *ngIf="phone.invalid && phone.touched" class="mt-1 block text-sm text-red-500">
            Please enter a valid phone number.
          </span>
        </div>

        <!-- SEND BUTTON -->
        <button
          type="submit"
          [disabled]="contactForm.invalid"
          class="h-[62px] w-full rounded-[18px] bg-[#7185e8] text-[16px] font-medium text-white transition hover:bg-[#5e73d9] disabled:cursor-not-allowed disabled:opacity-70"
        >
          Send
        </button>

        <!-- SUCCESS MESSAGE -->
        <p *ngIf="submitted" class="text-center text-sm font-medium text-green-600">
          Thank you! Your details have been submitted successfully.
        </p>

      </form>

    </section>
     </main>
</div>
