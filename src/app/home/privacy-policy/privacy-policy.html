
<div class="min-h-screen w-full overflow-hidden rounded-[24px] bg-white font-sans text-[#555555]">

 

  <!-- BANNER -->
  <section class="relative flex min-h-[187px] items-center overflow-visible bg-[#7889e8] px-8 md:min-h-[187px] md:px-10 lg:px-[7%]">

    <h1 class="relative z-10 max-w-[450px] text-4xl font-bold leading-tight text-white md:text-5xl lg:text-[48px]">
      Privacy And<br class="hidden sm:block" /> Policy
    </h1>

    <!-- PRIVACY ILLUSTRATION -->
    <img
     src="/imgcomponent/privacy-policy/rafiki.png"
      alt="Privacy Policy Illustration"
      class="absolute -bottom-[120px] right-[4%] z-20 block h-[250px] w-[270px] object-contain sm:h-[280px] sm:w-[310px] md:-bottom-[125px] md:right-[5%] md:h-[320px] md:w-[350px] lg:h-[340px] lg:w-[380px]"
    />

  </section>

  <!-- PRIVACY CONTENT -->
  <main class="mx-auto w-full max-w-[1440px] px-7 pb-10 pt-10 md:px-12 lg:px-[6%]">

    <p class="mb-5 max-w-[850px] text-[13px] leading-[29px] text-[#555555] md:text-[13px]">
      At Vativa Designs and Development, we value your privacy and are committed to protecting your personal and project-related information.
    </p>

    <div class="space-y-2">
      <section *ngFor="let section of sections">

        <h2 class="mb-2 text-[13px] font-semibold text-[#7185e8]">
          {{ section.heading }}
        </h2>

        <ul class="list-disc space-y-2 pl-[18px] text-[12px] leading-[23px] text-[#555555] md:text-[13px]">
          <li *ngFor="let point of section.points">
            {{ point }}
          </li>
        </ul>

      </section>
    </div>

  </main>
